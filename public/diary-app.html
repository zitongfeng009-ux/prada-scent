<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base target="_top" />
  <title>情绪日记 | Prada 香气地图</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #F7F6F2;
      --ink: #0D0D0D;
      --muted: rgba(13,13,13,0.4);
      --border: rgba(13,13,13,0.07);
      --card-bg: #ffffff;
      --detail-bg: #FAFAF8;
      --serif: Georgia, 'Times New Roman', serif;
      --sans: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    }

    html { font-family: var(--sans); background: var(--bg); color: var(--ink); }
    body {
      min-height: 100vh;
      background:
        radial-gradient(70% 40% at 0% 0%, rgba(232,160,180,0.08) 0%, rgba(232,160,180,0) 60%),
        radial-gradient(60% 36% at 100% 8%, rgba(154,193,198,0.10) 0%, rgba(154,193,198,0) 60%),
        var(--bg);
    }
    button { font-family: inherit; cursor: pointer; outline: none; }
    a { text-decoration: none; color: inherit; }

    /* ── header ── */
    .site-header {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 24px;
      background: rgba(247,246,242,0.88);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .site-header a, .site-header span {
      font-size: 9px; text-transform: uppercase; letter-spacing: .2em;
      color: var(--muted);
    }
    .site-header .title { color: rgba(13,13,13,0.6); }
    .header-right { display: flex; align-items: center; gap: 12px; }

    /* 头像（香气地图开关） */
    .avatar {
      position: relative; width: 38px; height: 38px; border-radius: 50%;
      border: none; background: transparent; padding: 0; flex-shrink: 0;
    }
    .avatar-ring {
      position: absolute; inset: 0; border-radius: 50%; padding: 2px;
      background: conic-gradient(from 120deg, #E8A0B4, #D9B24B, #7FA8A8, #C7B8E8, #E8A0B4);
    }
    .avatar-core {
      position: absolute; inset: 3px; border-radius: 50%;
      background: linear-gradient(145deg, #fff, #F1EDE6);
      color: #0D0D0D; font-size: 14px; font-family: Georgia, serif;
      display: flex; align-items: center; justify-content: center;
      transition: transform .2s;
    }
    .avatar:hover .avatar-core { transform: scale(1.05); }
    .avatar.active .avatar-ring { animation: ringspin 3s linear infinite; }
    .avatar.active::after {
      content: ''; position: absolute; inset: -6px; border-radius: 50%;
      border: 1px solid rgba(232,160,180,0.6);
      animation: ringpulse 1.6s ease-out infinite;
    }
    @keyframes ringspin { to { transform: rotate(360deg); } }
    @keyframes ringpulse { 0% { transform: scale(.9); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }

    /* ── page container ── */
    .container { max-width: 672px; margin: 0 auto; padding: 32px 16px 80px; }

    /* ── stats panel ── */
    .stats-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px; margin-bottom: 28px;
      box-shadow: 0 12px 32px -22px rgba(13,13,13,.14);
    }
    .stats-panel .panel-label {
      font-size: 8px; text-transform: uppercase; letter-spacing: .2em;
      color: rgba(13,13,13,0.35); margin-bottom: 16px;
    }
    .stats-grid {
      display: grid; grid-template-columns: repeat(3,1fr); gap: 16px;
    }
    @media(max-width:520px){ .stats-grid{ grid-template-columns: repeat(2,1fr); } }
    .stat-item .stat-sublabel {
      font-size: 7px; text-transform: uppercase; letter-spacing: .1em;
      color: rgba(13,13,13,0.35); margin-bottom: 4px;
    }
    .stat-item .big-num {
      font-family: var(--serif); font-size: 26px; line-height: 1;
    }
    .stat-item .big-unit { font-size: 8px; color: rgba(13,13,13,0.35); margin-left: 2px; }
    .dot-row { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .dot-label { font-size: 9px; }
    .dot-count { font-size: 7px; color: rgba(13,13,13,0.35); }

    /* ── filter bar ── */
    .filter-bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .filter-label { font-size: 7px; text-transform: uppercase; letter-spacing: .1em; color: rgba(13,13,13,0.35); margin-right: 2px; }
    .filter-btn {
      font-size: 7px; text-transform: uppercase; letter-spacing: .1em;
      padding: 5px 10px; border-radius: 20px;
      border: 1px solid rgba(13,13,13,0.14);
      background: transparent; color: rgba(13,13,13,0.5);
      transition: all .2s;
    }
    .filter-btn.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .filter-btn:hover:not(.active){ background: rgba(13,13,13,0.04); }

    /* ── prescription card ── */
    .rx-card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 18px; margin-bottom: 14px;
      overflow: hidden; box-shadow: 0 10px 28px -22px rgba(13,13,13,.12);
    }
    .rx-head {
      display: flex; align-items: flex-start; gap: 16px;
      padding: 16px 18px;
      width: 100%; text-align: left; background: transparent; border: none;
      cursor: pointer;
    }
    .rx-head:hover { background: rgba(13,13,13,0.015); }

    /* date col */
    .rx-date { flex-shrink: 0; width: 48px; display: flex; flex-direction: column; align-items: center; }
    .rx-index { font-size: 8px; text-transform: uppercase; letter-spacing: .15em; color: rgba(13,13,13,0.28); }
    .rx-day { font-family: var(--serif); font-size: 17px; line-height: 1.1; color: var(--ink); margin-top: 2px; }
    .rx-time { font-size: 8px; color: rgba(13,13,13,0.38); }

    /* mid col */
    .rx-mid { flex: 1; min-width: 0; }
    .rx-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
    .rx-location { font-size: 10px; }
    .rx-scene {
      font-size: 7px; padding: 2px 8px; border-radius: 20px;
      background: rgba(13,13,13,0.05); color: rgba(13,13,13,0.5);
    }
    .rx-emotions { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 7px; }
    .emotion-tag {
      font-size: 8px; padding: 2px 6px; border-radius: 8px;
      background: rgba(13,13,13,0.04); color: var(--ink);
    }
    .rx-excerpt {
      font-size: 10px; line-height: 1.5; color: rgba(13,13,13,0.5);
      font-style: italic;
    }

    /* right col */
    .rx-right { flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
    .family-tag {
      font-size: 7px; padding: 2px 6px;
      border: 1px solid; /* set inline */
    }
    .rx-fragname { font-size: 8px; color: rgba(13,13,13,0.55); text-align: right; max-width: 80px; word-break: break-all; }
    .conflict-badge { font-size: 7px; color: #C84B4B; }
    .chevron { font-size: 8px; color: rgba(13,13,13,0.28); transition: transform .2s; margin-top: auto; }
    .chevron.open { transform: rotate(180deg); }

    /* ── detail panel ── */
    .rx-detail {
      border-top: 1px solid rgba(13,13,13,0.06);
      background: var(--detail-bg);
      display: none;
    }
    .rx-detail.open { display: block; }
    .rx-detail-full-date {
      padding: 14px 18px 6px;
      font-size: 8px; text-transform: uppercase; letter-spacing: .14em;
      color: rgba(13,13,13,0.3);
    }

    /* ── 本日人格线索 (per-card) ── */
    .dim-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; padding: 0 18px 14px; }
    @media(max-width:440px){ .dim-row{ grid-template-columns:1fr; } }
    .dim-cell { display: flex; align-items: flex-start; gap: 9px; padding: 10px; border-radius: 12px; border: 1px solid rgba(13,13,13,0.06); background: #fff; }
    .dim-badge { flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: var(--bg); font-size: 12px; display: flex; align-items: center; justify-content: center; }
    .dim-body { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .dim-title { font-size: 9px; font-weight: 600; color: var(--ink); }
    .dim-text { font-size: 8px; line-height: 1.45; color: rgba(13,13,13,0.44); }

    /* conflict bar */
    .conflict-bar {
      margin: 0 18px 14px; padding: 8px 12px; border-radius: 12px;
      font-size: 10px; line-height: 1.5;
      background: rgba(200,75,75,0.06);
      border: 1px solid rgba(200,75,75,0.15);
      color: #C84B4B;
    }

    /* tri-mapping */
    .tri-title {
      padding: 0 18px 8px;
      font-size: 8px; text-transform: uppercase; letter-spacing: .14em;
      color: rgba(13,13,13,0.32);
    }
    .tri-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; padding: 0 18px 14px; }
    .tri-cell { padding: 8px; border-radius: 12px; border: 1px solid rgba(13,13,13,0.06); background: #fff; }
    .tri-cell-icon { font-size: 8px; color: rgba(13,13,13,0.38); margin-bottom: 4px; }
    .tri-cell-label { font-size: 10px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
    .tri-cell-factors { font-size: 8px; line-height: 1.4; color: rgba(13,13,13,0.44); }

    /* narrative blocks */
    .narrative-block { padding: 0 18px 14px; }
    .block-label {
      font-size: 8px; text-transform: uppercase; letter-spacing: .14em;
      color: rgba(13,13,13,0.32); margin-bottom: 6px;
    }
    .block-text {
      font-size: 11px; line-height: 1.6; color: rgba(13,13,13,0.68);
      font-family: var(--serif); font-style: italic;
    }
    .block-text.small { font-family: var(--sans); font-style: normal; font-size: 10px; color: rgba(13,13,13,0.55); }
    .twin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 0 18px 14px; }
    @media(max-width:440px){ .twin-grid{ grid-template-columns:1fr; } }

    /* fragrance list */
    .frag-list { display: flex; flex-direction: column; gap: 6px; padding: 0 18px 14px; }
    .frag-row {
      display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px;
      border-radius: 12px; border: 1px solid rgba(13,13,13,0.06); background: #fff;
    }
    .frag-thumb {
      flex-shrink: 0; width: 32px; height: 42px;
      background: rgba(13,13,13,0.04); overflow: hidden; border-radius: 6px;
    }
    .frag-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .frag-rank { font-size: 7px; color: rgba(13,13,13,0.28); flex-shrink: 0; padding-top: 2px; }
    .frag-info { flex: 1; min-width: 0; }
    .frag-name { font-size: 10px; font-weight: 500; color: var(--ink); }
    .frag-sub { font-size: 8px; color: rgba(13,13,13,0.44); margin-bottom: 3px; }
    .frag-story {
      font-size: 8px; line-height: 1.4;
      color: rgba(13,13,13,0.36);
      font-family: var(--serif); font-style: italic;
    }
    .frag-btn {
      font-size: 7px; text-transform: uppercase; letter-spacing: .1em;
      padding: 5px 10px; border-radius: 20px; flex-shrink: 0;
      border: 1px solid rgba(13,13,13,0.14); color: rgba(13,13,13,0.48);
      background: transparent;
    }
    .frag-btn:hover { background: rgba(13,13,13,0.04); }

    /* CTA row */
    .cta-row { padding: 0 18px 18px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .cta-btn {
      display: inline-block; padding: 10px 20px; border-radius: 22px;
      font-size: 8px; text-transform: uppercase; letter-spacing: .15em;
      background: var(--ink); color: var(--bg);
      border: none; cursor: pointer; transition: all .25s;
    }
    .cta-btn:hover { background: var(--bg); color: var(--ink); outline: 1px solid var(--ink); }
    .cta-type { font-size: 7px; color: rgba(13,13,13,0.32); }

    /* ── bottom new-entry cta ── */
    .bottom-cta { text-align: center; margin-top: 36px; }
    .bottom-cta a {
      display: inline-block; padding: 12px 32px; border-radius: 24px;
      font-size: 9px; text-transform: uppercase; letter-spacing: .15em;
      border: 1px solid rgba(13,13,13,0.18); color: rgba(13,13,13,0.55);
      transition: all .25s;
    }
    .bottom-cta a:hover { background: rgba(13,13,13,0.04); }

    /* record count hint */
    .filter-count { font-size: 8px; color: rgba(13,13,13,0.32); margin-bottom: 10px; }

    /* ── 香气人格卡片 ── */
    .personality-card {
      display: flex; align-items: center; gap: 22px;
      padding: 18px; margin-bottom: 20px;
      border: 1px solid rgba(13,13,13,0.07);
      border-radius: 18px;
      background:
        radial-gradient(120% 140% at 100% 0%, rgba(200,214,175,0.16) 0%, rgba(200,214,175,0) 55%),
        #fff;
    }
    @media(max-width:520px){ .personality-card{ flex-direction: column; text-align: center; gap: 14px; } }
    .p-portrait { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 7px; }
    .p-frag-frame {
      position: relative; width: 108px; height: 146px; border-radius: 16px;
      overflow: hidden; cursor: pointer;
      border: 1px solid rgba(13,13,13,0.07);
      background:
        radial-gradient(120% 90% at 50% 0%, color-mix(in srgb, var(--pf) 22%, transparent) 0%, transparent 62%),
        linear-gradient(160deg, #F3F0EA, #EAE6DF);
      box-shadow: 0 10px 24px -12px rgba(13,13,13,.18);
      transition: transform .2s;
    }
    .p-frag-frame:hover { transform: translateY(-2px); }
    .p-frag-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .p-frag-tag {
      position: absolute; left: 8px; bottom: 8px;
      font-size: 7px; letter-spacing: .08em; padding: 3px 8px; border-radius: 20px;
      border: 1px solid; backdrop-filter: blur(6px); background: rgba(255,255,255,0.35);
    }
    .p-frag-cap { font-size: 7px; color: rgba(13,13,13,0.34); }
    .p-type-meta {
      font-size: 7px; text-transform: uppercase; letter-spacing: .18em;
      color: rgba(13,13,13,0.28); margin-bottom: 4px;
      display: flex; align-items: center; gap: 7px;
    }
    .p-type-meta::before {
      content: ''; display: inline-block; width: 16px; height: 1px;
      background: linear-gradient(to right, rgba(232,160,180,0.7), rgba(217,178,75,0.5));
    }
    .p-fit { font-size: 9px; color: rgba(13,13,13,0.45); margin-bottom: 4px; letter-spacing: .02em; }
    .p-fit b { font-weight: 600; color: var(--ink); font-family: var(--serif); font-size: 13px; }
    .p-info { flex: 1; min-width: 0; }
    .p-code-line { display: flex; align-items: baseline; justify-content: center; margin-bottom: 6px; }
    @media(min-width:521px){ .p-code-line{ justify-content: flex-start; } }
    .p-code { font-family: var(--serif); font-size: 30px; letter-spacing: .05em; line-height: 1; }
    .p-name { font-size: 14px; font-weight: 600; margin-left: 10px; color: rgba(13,13,13,0.75); }
    .p-tagline { font-size: 10px; font-family: var(--serif); font-style: italic; color: rgba(13,13,13,0.55); line-height: 1.5; margin-bottom: 12px; }
    .p-accords { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 14px; }
    @media(min-width:521px){ .p-accords{ justify-content: flex-start; } }
    .p-accord {
      font-size: 7px; text-transform: uppercase; letter-spacing: .12em;
      padding: 3px 8px; border-radius: 20px; border: 1px solid rgba(13,13,13,0.14); color: rgba(13,13,13,0.5);
      background: rgba(13,13,13,0.02);
    }
    .p-axes { display: flex; flex-direction: column; gap: 8px; }
    .axis-row { display: grid; grid-template-columns: 28px 1fr 28px; align-items: center; gap: 7px; }
    .axis-side { font-size: 7px; text-transform: uppercase; letter-spacing: .1em; color: rgba(13,13,13,0.28); line-height: 1.15; }
    .axis-side.right { text-align: right; }
    .axis-side strong { font-size: 9px; display: block; }
    .axis-side i { font-style: normal; font-size: 6px; opacity: .75; }
    .axis-side.active { color: var(--ink); }
    .axis-bar { position: relative; height: 3px; background: rgba(13,13,13,0.09); border-radius: 2px; }
    .axis-fill { position: absolute; top: 0; bottom: 0; left: 0; background: var(--ink); opacity: .85; }
    .axis-fill.right { left: auto; right: 0; }
    .axis-knob { position: absolute; top: 50%; width: 7px; height: 7px; border-radius: 50%; background: var(--ink); transform: translate(-50%,-50%); box-shadow: 0 0 0 2px #fff; }

    /* ── 香气地图 ── */
    .map-section { margin-bottom: 22px; }
    .map-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 8px; flex-wrap: wrap; }
    .map-today-tag {
      font-size: 9px; padding: 4px 12px; border-radius: 20px;
      background: linear-gradient(120deg, rgba(232,160,180,0.22), rgba(217,178,75,0.18));
      color: rgba(13,13,13,0.7); letter-spacing: .03em;
      animation: fadein .4s ease;
    }
    .map-hint-btn {
      font-size: 8px; padding: 5px 12px; border-radius: 20px;
      border: 1px dashed rgba(13,13,13,0.24); color: rgba(13,13,13,0.55);
      background: transparent; transition: all .2s;
    }
    .map-hint-btn:hover { border-style: solid; border-color: rgba(13,13,13,0.4); }
    .map-cats { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .cat-chip {
      font-size: 8px; letter-spacing: .04em;
      padding: 6px 14px; border-radius: 20px;
      border: 1px solid rgba(13,13,13,0.12); color: rgba(13,13,13,0.5);
      background: rgba(255,255,255,0.75); transition: all .22s;
      backdrop-filter: blur(4px);
    }
    .cat-chip:hover { border-color: rgba(13,13,13,0.28); background: rgba(255,255,255,0.92); }
    .cat-chip.active { border-color: transparent; color: #fff; font-weight: 500; }

    .map-viewport {
      position: relative; height: 420px; overflow: hidden;
      border-radius: 22px; border: 1px solid rgba(13,13,13,0.06);
      background:
        radial-gradient(60% 80% at 18% 12%, rgba(232,160,180,0.28) 0%, rgba(232,160,180,0) 62%),
        radial-gradient(55% 70% at 82% 18%, rgba(154,193,198,0.28) 0%, rgba(154,193,198,0) 62%),
        radial-gradient(70% 80% at 50% 96%, rgba(217,178,75,0.18) 0%, rgba(217,178,75,0) 60%),
        radial-gradient(45% 55% at 75% 72%, rgba(180,160,220,0.16) 0%, rgba(180,160,220,0) 60%),
        radial-gradient(rgba(13,13,13,0.04) 1px, transparent 1.5px),
        linear-gradient(160deg, #F0ECE6, #FAF8F3);
      background-size: auto, auto, auto, auto, 22px 22px, auto;
      cursor: grab; touch-action: none; user-select: none;
      box-shadow: 0 2px 24px -8px rgba(13,13,13,0.08);
    }
    .map-viewport:active { cursor: grabbing; }
    .map-viewport.map-pulse { box-shadow: 0 0 0 3px rgba(232,160,180,0.35); }

    .map-world { position: absolute; left: 0; top: 0; transform-origin: 0 0; width: 880px; height: 520px; }
    .map-links { position: absolute; left: 0; top: 0; pointer-events: none; }

    .map-node {
      position: absolute; width: 82px; height: 96px;
      transform: translate(-50%, -50%);
      display: flex; flex-direction: column; align-items: center;
      cursor: pointer; user-select: none;
      transition: transform .18s cubic-bezier(.34,1.56,.64,1);
    }
    .map-node:hover, .map-node:focus { transform: translate(-50%, -50%) scale(1.1); z-index: 3; outline: none; }

    /* Instagram 故事圆圈风格 ring */
    .map-node-ring {
      position: absolute; top: 0; width: 62px; height: 62px;
      border-radius: 50%; z-index: 0;
      background: conic-gradient(from 0deg, var(--c1) 0%, var(--c2) 40%, var(--c1) 70%, var(--c2) 100%);
      opacity: 0;
      transition: opacity .22s, transform .22s;
      transform: scale(0.82);
      filter: blur(0.5px);
    }
    .map-node:hover .map-node-ring,
    .map-node:focus .map-node-ring {
      opacity: 0.82;
      transform: scale(1);
      animation: ringspin 2.8s linear infinite;
    }
    /* 白色间隔环（Instagram 故事白边） */
    .map-node-ring::after {
      content: ''; position: absolute; inset: 3px; border-radius: 50%;
      background: var(--bg, #F7F6F2);
    }

    .map-node-orb {
      position: relative; width: 52px; height: 52px; border-radius: 50%; z-index: 1;
      background:
        radial-gradient(circle at 30% 24%, rgba(255,255,255,0.92) 0%, rgba(255,255,255,0) 36%),
        radial-gradient(circle at 68% 76%, rgba(255,255,255,0.30) 0%, rgba(255,255,255,0) 42%),
        radial-gradient(ellipse at 50% 110%, rgba(0,0,0,0.08) 0%, transparent 66%),
        linear-gradient(145deg, var(--c1), var(--c2));
      box-shadow:
        0 10px 24px -6px var(--c2),
        inset 0 0 0 1px rgba(255,255,255,0.32),
        0 0 36px -8px var(--c2);
    }
    .map-node-orb::after {
      content: ''; position: absolute; inset: -12px; border-radius: 50%;

function pradaLookup(frag) {
  if (!frag) return null;
  if (PRADA_DB[frag.id]) return PRADA_DB[frag.id];
  const alias = PRADA_ALIAS[frag.id];
  return alias && PRADA_DB[alias] ? PRADA_DB[alias] : null;
}
function fragName(frag) {
  const db = pradaLookup(frag);
  return db ? db.name : (frag && (frag.name || frag.id)) || '';
}
function fragImage(frag) {
  const db = pradaLookup(frag);
  return db ? db.imageUrl : (frag && frag.imageUrl);
}

function shortFragName(name) {
  const s = String(name || '');
  const cleaned = s.replace(/^Prada\s+/i, '');
  const m = cleaned.match(/[一-龥]+$/);
  if (m && m[0].length <= 6) return m[0];
  const parts = cleaned.split(/\s+/);
  return parts[parts.length - 1] || cleaned;
}

const S_FAMILIES     = ['fresh','citrus','floral','aromatic'];
const N_FAMILIES     = ['oriental','chypre','fougere','woody'];
const E_SCENES       = ['social_boost','outdoor_park','commute_subway'];
const I_SCENES       = ['sleep_relax','deep_work','mercury_reversal'];
const FEEL_EMOTIONS  = ['anxious','sad','romantic','irritated'];
const STATE_EMOTIONS = ['happy','calm','energetic','tired'];

function computePersonality(list) {
  if (!list || !list.length) return null;
  let E=0, I=0, S=0, N=0, T=0, F=0;
  const famSet = new Set();

  list.forEach(rx => {
    const user  = (rx.request && rx.request.user) || {};
    const scene = user.scene;
    const emotions = user.emotions || [];
    const fams = (rx.recommendedFragrances||[]).map(f=>f.family);
    fams.forEach(f => f && famSet.add(f));

    if (E_SCENES.includes(scene)) E++;
    else if (I_SCENES.includes(scene)) I++;
    else {
      const ed = rx.energyDeviation || {};
      if ((ed.emotionEnergy||0) < (ed.environmentEnergy||0)) I++; else E++;
    }

    fams.forEach(f => {
      if (S_FAMILIES.includes(f)) S++;
      else if (N_FAMILIES.includes(f)) N++;
    });

    const fCnt = emotions.filter(e=>FEEL_EMOTIONS.includes(e)).length;
    const sCnt = emotions.filter(e=>STATE_EMOTIONS.includes(e)).length;
    if (fCnt >= sCnt) F += Math.max(fCnt,1); else T += Math.max(sCnt,1);
    if (['deep_work','commute_subway'].includes(scene)) T++;
  });

  const ePct = Math.round(E/(E+I||1)*100);
  const sPct = Math.round(S/(S+N||1)*100);
  const tPct = Math.round(T/(T+F||1)*100);
  const pPct = list.length <= 1 ? 32 : Math.min(100, Math.round(famSet.size/list.length*80));

  const actual = { ei:ePct, sn:sPct, tf:tPct, jp:100-pPct };
  let best = PERSONALITY_TYPES.citrine, bestD = Infinity, bestFit = 0;
  Object.values(PERSONALITY_TYPES).forEach(t => {
    const pr = t.profile;
    const d = Math.hypot(actual.ei-pr.ei, actual.sn-pr.sn, actual.tf-pr.tf, actual.jp-pr.jp);
    const sumAbs = Math.abs(actual.ei-pr.ei) + Math.abs(actual.sn-pr.sn) + Math.abs(actual.tf-pr.tf) + Math.abs(actual.jp-pr.jp);
    const fit = Math.max(0, Math.min(100, Math.round(100 - sumAbs/4)));
    if (d < bestD) { bestD = d; best = t; bestFit = fit; }
  });

  return {
    type: best, fit: bestFit, count: list.length,
    axes: [
      { key:'EI', leftPct:ePct },
      { key:'SN', leftPct:sPct },
      { key:'TF', leftPct:tPct },
      { key:'JP', leftPct:100-pPct },
    ],
  };
}

function axisBarHTML(axis) {
  const m = AXIS_META[axis.key];
  const leftActive = axis.leftPct >= 50;
  const pct = leftActive ? axis.leftPct : 100 - axis.leftPct;
  return `<div class="axis-row">
    <span class="axis-side ${leftActive?'active':''}"><strong>${m.leftName}</strong><i>${m.left}</i></span>
    <div class="axis-bar">
      <div class="axis-fill ${leftActive?'':'right'}" style="width:${pct}%"></div>
      <span class="axis-knob" style="left:${axis.leftPct}%"></span>
    </div>
    <span class="axis-side right ${leftActive?'':'active'}"><strong>${m.rightName}</strong><i>${m.right}</i></span>
  </div>`;
}

// 用户偏好匹配出的"最适宜香水"：出现频次 + 最近一次记录加权
function bestPerfume(list) {
  if (!list || !list.length) return null;
  const latestT = Math.max(...list.map(rx => new Date(rx.createdAt).getTime()));
  const t = {};
  list.forEach(rx => {
    const isLatest = new Date(rx.createdAt).getTime() === latestT;
    (rx.recommendedFragrances||[]).forEach((f,i) => {
      const key = f.id || f.name;
      const rec = t[key] = t[key] || { frag:f, score:0, last:0 };
      rec.score += (isLatest ? 2 : 1) + (i===0 ? 2 : (i===1 ? 1 : 0));
      rec.last = Math.max(rec.last, new Date(rx.createdAt).getTime());
    });
  });
  const best = Object.values(t).sort((a,b) => b.score - a.score || b.last - a.last)[0];
  return best ? best.frag : null;
}

function recordDimensions(rx) {
  const user  = (rx.request && rx.request.user) || {};
  const scene = user.scene;
  const emotions = user.emotions || [];
  const top = (rx.recommendedFragrances||[])[0];
  const topFam = top && top.family;
  const ed = rx.energyDeviation || {};

  let sceneDim;
  if (E_SCENES.includes(scene))       sceneDim = { icon:'🌆', title:'场景 · 外放', text:'走向人群 · '+(SCENE_LABEL[scene]||scene) };
  else if (I_SCENES.includes(scene))  sceneDim = { icon:'🕯️', title:'场景 · 内敛', text:'回归自身 · '+(SCENE_LABEL[scene]||scene) };
  else sceneDim = ((ed.emotionEnergy||0) < (ed.environmentEnergy||0))
    ? { icon:'🕯️', title:'能量 · 内敛', text:'情绪能量低于环境压力' }
    : { icon:'🌆', title:'能量 · 外放', text:'情绪能量高于环境压力' };

  const fCnt = emotions.filter(e=>FEEL_EMOTIONS.includes(e)).length;
  const sCnt = emotions.filter(e=>STATE_EMOTIONS.includes(e)).length;
  const emoText = emotions.map(e=>EMOTION_LABEL[e]||e).join('、') || '—';
  const emotionDim = (fCnt >= sCnt)
    ? { icon:'💗', title:'情绪 · 感性', text:'情绪驱动选香 · '+emoText }
    : { icon:'⚖️', title:'情绪 · 理性', text:'状态导向选香 · '+emoText };

  const scentDim = S_FAMILIES.includes(topFam)
    ? { icon:'🌿', title:'香型 · 具象', text:(FAMILY_LABEL[topFam]||topFam||'—')+' · 自然可辨的气息' }
    : { icon:'🌀', title:'香型 · 抽象', text:(FAMILY_LABEL[topFam]||topFam||'—')+' · 复杂层叠的结构' };

  return [sceneDim, emotionDim, scentDim];
}

function loadPrescriptions() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    const list = Array.isArray(parsed) ? parsed : [parsed];
    return list.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
  } catch { return null; }
}

function fmtDate(iso) {
  const d = new Date(iso);
  return `${d.getMonth()+1}/${String(d.getDate()).padStart(2,'0')}`;
}
function fmtTime(iso) {
  const d = new Date(iso);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function fmtFull(iso) {
  return new Date(iso).toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
}
function truncate(str, n=55) { return str.length>n ? str.slice(0,n)+'…' : str; }

function topFamilies(list) {
  const t={};
  list.forEach(rx => rx.recommendedFragrances.forEach(f => { t[f.family]=(t[f.family]||0)+1; }));
  return Object.entries(t).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([family,count])=>({family,count}));
}
function topEmotions(list) {
  const t={};
  list.forEach(rx => rx.request.user.emotions.forEach(e => { t[e]=(t[e]||0)+1; }));
  return Object.entries(t).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([emotion,count])=>({emotion,count}));
}
function dateStr(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtDateShort(ds) {
  const [,mo,d] = ds.split('-').map(Number);
  return `${mo}月${d}日`;
}
function clamp(v,min,max) { return Math.max(min, Math.min(max, v)); }
function lighten(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.round(255 - (255 - ((n>>16)&255)) * amt);
  const g = Math.round(255 - (255 - ((n>>8)&255)) * amt);
  const b = Math.round(255 - (255 - (n&255)) * amt);
  return `rgb(${r},${g},${b})`;
}

// 气味 → 情绪/场景分类（自然 / 快乐 / 活力 / 旅行）
function scentCategoryTags(frag) {
  if (!frag) return ['happy'];
  const db = pradaLookup(frag);
  const scenes  = (db ? db.scenes : null) || frag.scenes || [];
  const emos    = (db ? db.suitableEmotions : null) || frag.suitableEmotions || [];
  const effects = (db ? db.effects : null) || frag.effects || [];
  const fam     = (frag.family||'').toLowerCase();
  const cats = [];
  if (['woody','fresh','aromatic','fougere','chypre'].includes(fam) || scenes.includes('outdoor_park') || effects.some(e=>['grounding','calming'].includes(e))) cats.push('nature');
  if (['floral','citrus'].includes(fam) || emos.some(e=>['happy','romantic','calm'].includes(e))) cats.push('happy');
  if (emos.includes('energetic') || effects.some(e=>['energizing','refreshing','uplifting','confidence'].includes(e))) cats.push('energy');
  if (scenes.some(s=>['commute_subway','outdoor_park','social_boost'].includes(s))) cats.push('travel');
  return cats.length ? cats : ['happy'];
}

  const w = 620, h = 160, padL = 36, padR = 18, padT = 24, padB = 30;
  const iw = w - padL - padR, ih = h - padT - padB;
  const X = i => padL + (i * (iw / (sorted.length - 1)));
  const Y = v => padT + ih * (1 - v / 100);

  const pts = sorted.map((rx, i) => {
    const v = Math.max(0, Math.min(100, rx.energyDeviation.emotionEnergy || 0));
    return { x: X(i), y: Y(v), v, rx };
  });

  const line = pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const area = `M${pts[0].x.toFixed(1)},${(padT+ih).toFixed(1)} L${pts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' L')} L${pts[pts.length-1].x.toFixed(1)},${(padT+ih).toFixed(1)} Z`;

  const grid = [25, 50, 75].map(v => {
    const gy = Y(v);
    return `<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${w-padR}" y2="${gy.toFixed(1)}" stroke="rgba(13,13,13,0.07)" stroke-width="1"/>`;
  }).join('');
  const yticks = [0, 25, 50, 75, 100].map(v => {
    const gy = Y(v);
    return `<text x="${padL-7}" y="${(gy+2).toFixed(1)}" text-anchor="end" font-size="7" fill="rgba(13,13,13,0.35)">${v}</text>`;
  }).join('');
  const xlabels = pts.map(p => {
    const d = new Date(p.rx.createdAt);
    return `<text x="${p.x.toFixed(1)}" y="${h-8}" text-anchor="middle" font-size="7" fill="rgba(13,13,13,0.4)">${d.getMonth()+1}/${String(d.getDate()).padStart(2,'0')}</text>`;
  }).join('');
  const markers = pts.map(p => {
    const emos = (p.rx.request && p.rx.request.user && p.rx.request.user.emotions) || [];
    const emo = emos[0];
    const emoji = EMOTION_EMOJI[emo] || '';
    const emoLabel = EMOTION_LABEL[emo] || '';
    const d = new Date(p.rx.createdAt);
    const dateTxt = `${d.getMonth()+1}月${d.getDate()}日 周${'日一二三四五六'[d.getDay()]}`;
    const tipHtml = `${dateTxt}\n情绪：${emoLabel||'—'} ${emoji}\n情绪能量：${p.v} / 100`;
    return `<g>
      <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="#0D0D0D"/>
      <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="6" fill="none" stroke="#F7F6F2" stroke-width="2"/>
      <text x="${p.x.toFixed(1)}" y="${(p.y-13).toFixed(1)}" text-anchor="middle" font-size="14">${emoji}</text>
      <text x="${p.x.toFixed(1)}" y="${(p.y+22).toFixed(1)}" text-anchor="middle" font-size="7" fill="rgba(13,13,13,0.5)">${emoLabel}</text>
      <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="18" fill="transparent" style="cursor:pointer"
        onmousemove="showTip(event, this)" onmouseleave="hideTip()" data-tip="${tipHtml}"/>
    </g>`;
  }).join('');

  return `<div class="trend-section">
    <div class="trend-head">
      <span class="filter-label">情绪趋势</span>
      <span class="trend-note">情绪能量随记录流动 · 由远及近</span>
    </div>
    <svg viewBox="0 0 ${w} ${h}" class="trend-svg" preserveAspectRatio="xMidYMid meet">
      ${grid}${yticks}
      <path d="${area}" fill="rgba(13,13,13,0.06)"/>
      <polyline points="${line}" fill="none" stroke="#0D0D0D" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${xlabels}${markers}
    </svg>
    <div class="trend-hint">悬停数据点查看详情</div>
    <div id="trend-tip"></div>
  </div>`;
}

// 香气地图（替代原星球日历）
// ─────────────────────────────────────────────────────────────
function scentMapRecords() {
  let recs = allPrescriptions;
  if (mapTodayMode) {
    const day = currentDate || (allPrescriptions[0] ? dateStr(allPrescriptions[0].createdAt) : null);
    recs = recs.filter(rx => day && dateStr(rx.createdAt) === day);
  }
  if (mapCategory !== 'all') {
    recs = recs.filter(rx => (rx.recommendedFragrances||[]).some(f => scentCategoryTags(f).includes(mapCategory)));
  }
  return recs;
}

function mapNodes(records) {
  const map = new Map();
  records.forEach(rx => (rx.recommendedFragrances||[]).forEach(f => {
    const id = f.id || f.name;
    if (!map.has(id)) map.set(id, { id, frag:f, count:0, days:new Set() });
    const n = map.get(id);
    n.count++;
    n.days.add(dateStr(rx.createdAt));
  }));
  return [...map.values()];
}

function mapLinks(nodes, records) {
  const pair = new Map();
  records.forEach(rx => {
    const ids = (rx.recommendedFragrances||[]).map(f => f.id || f.name);
    for (let i=0;i<ids.length;i++) for (let j=i+1;j<ids.length;j++) {
      const key = [ids[i], ids[j]].sort().join('::');
      pair.set(key, (pair.get(key)||0)+1);
    }
  });
  const byId = new Map(nodes.map(n => [n.id, n]));
  const links = [];
  pair.forEach((w, key) => {
    const [a, b] = key.split('::');
    if (byId.has(a) && byId.has(b)) links.push({ a:byId.get(a), b:byId.get(b), w });
  });
  return links;
}

// 力导向布局：位置代表香气之间的关联 / 距离
function layoutMap(nodes, links) {
  if (!nodes.length) return;
  nodes.forEach((n, i) => {
    const ang = i * 2.399963;
    const rad = 150 + (i % 4) * 26;
    n.x = MAP_W/2 + Math.cos(ang) * rad;
    n.y = MAP_H/2 + Math.sin(ang) * rad;
    n.vx = 0; n.vy = 0;
  });
  for (let it=0; it<160; it++) {
    for (let i=0;i<nodes.length;i++) for (let j=i+1;j<nodes.length;j++) {
      const a = nodes[i], b = nodes[j];
      let dx = a.x - b.x, dy = a.y - b.y;
      let d2 = dx*dx + dy*dy;
      if (d2 < 1) { d2 = 1; dx = (i%2?1:-1)*0.6; dy = (j%2?1:-1)*0.6; }
      const d = Math.sqrt(d2);
      const f = 12000 / d2;
      const fx = dx/d*f, fy = dy/d*f;
      a.vx += fx; a.vy += fy;
      b.vx -= fx; b.vy -= fy;
    }
    links.forEach(l => {
      const dx = l.b.x - l.a.x, dy = l.b.y - l.a.y;
      const d = Math.hypot(dx, dy) || 1;
      const target = 150 - l.w * 26;
      const f = (d - target) * 0.015;
      const fx = dx/d*f, fy = dy/d*f;
      l.a.vx += fx; l.a.vy += fy;
      l.b.vx -= fx; l.b.vy -= fy;
    });
    nodes.forEach(n => {
      n.vx += (MAP_W/2 - n.x) * 0.001;
      n.vy += (MAP_H/2 - n.y) * 0.001;
      n.x += n.vx; n.y += n.vy;
      n.vx = clamp(n.vx, -3, 3); n.vy = clamp(n.vy, -3, 3);
      n.vx *= 0.85; n.vy *= 0.85;
    });
  }
  nodes.forEach(n => {
    n.x = clamp(n.x, 70, MAP_W-70);
    n.y = clamp(n.y, 70, MAP_H-70);
  });
}

function renderScentMap() {
  const recs = scentMapRecords();
  const nodes = mapNodes(recs);
  const links = mapLinks(nodes, recs);
  layoutMap(nodes, links);

  const day = currentDate || (allPrescriptions[0] ? dateStr(allPrescriptions[0].createdAt) : null);

  const CAT_GRAD = {
    all:    'linear-gradient(135deg,#1a1a1a,#3a3a3a)',
    nature: 'linear-gradient(135deg,#6AB87A,#3A7A5E)',
    happy:  'linear-gradient(135deg,#F4A8C0,#C46A82)',
    energy: 'linear-gradient(135deg,#F0D470,#D9A42E)',
    travel: 'linear-gradient(135deg,#6EC8CC,#3A8F96)',
  };
  const chips = ['all', ...Object.keys(SCENT_CATEGORIES)].map(c => {
    const isActive = mapCategory === c;
    const meta = c==='all' ? { label:'全部', color:'#0D0D0D', emoji:'' } : SCENT_CATEGORIES[c];
    const activeStyle = isActive ? `background:${CAT_GRAD[c]||meta.color};color:#fff;border-color:transparent` : '';
    return `<button class="cat-chip${isActive?' active':''}" style="${activeStyle}" onclick="setMapCategory('${c}')">${meta.emoji} ${meta.label}</button>`;
  }).join('');

  const nodeHtml = nodes.map(n => {
    const name = fragName(n.frag);
    const fam = n.frag.family;
    const col = FAMILY_COLOR[fam] || '#8A8A8A';
    const c1 = lighten(col, 0.55); /* 更亮的高光色，让渐变更通透 */
    const cats = scentCategoryTags(n.frag);
    const tooltip = `${name}\n${FAMILY_LABEL[fam]||fam} · 收藏 ${n.count} 次\n${cats.map(c=>SCENT_CATEGORIES[c].emoji+SCENT_CATEGORIES[c].label).join(' / ')}`;
    const catEmoji = cats.length ? SCENT_CATEGORIES[cats[0]].emoji : '';
    return `<div class="map-node" style="left:${n.x.toFixed(1)}px;top:${n.y.toFixed(1)}px;--c1:${c1};--c2:${col}" role="button" tabindex="0"
      onclick="openScent('${n.id}')"
      onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openScent('${n.id}')}"
      onmousemove="mapTip(event, this)" onmouseleave="mapTipHide()" data-tip="${tooltip}">
      <span class="map-node-ring"></span>
      <span class="map-node-orb"><span class="map-node-core"></span></span>
      ${catEmoji ? `<span class="map-node-badge">${catEmoji}</span>` : ''}
      <span class="map-node-name">${shortFragName(name)}</span>
      <span class="map-node-count">×${n.count}</span>
    </div>`;
  }).join('');

  const linkSvg = links.map(l =>
    `<line x1="${l.a.x.toFixed(1)}" y1="${l.a.y.toFixed(1)}" x2="${l.b.x.toFixed(1)}" y2="${l.b.y.toFixed(1)}" stroke="rgba(13,13,13,0.13)" stroke-width="${Math.min(2, 0.6+l.w).toFixed(1)}" stroke-dasharray="2 5"/>`
  ).join('');

  const famsInMap = [...new Set(nodes.map(n => n.frag.family).filter(Boolean))];
  const legend = famsInMap.map(f =>
    `<span class="map-lg"><i style="background:${FAMILY_COLOR[f]||'#888'}"></i>${FAMILY_LABEL[f]||f}</span>`
  ).join('');

  const todayTag = mapTodayMode
    ? `<span class="map-today-tag">✨ ${fmtDateShort(day)} 收集 ${nodes.length} 款香气</span>`
    : `<button class="map-hint-btn" onclick="activateMap()">点顶部头像 · 看今日收集</button>`;

  return `
  <section class="map-section">
    <div class="map-head">
      <span class="filter-label">香气地图</span>
      ${todayTag}
    </div>
    <div class="map-cats">${chips}</div>
    <div class="map-viewport" id="map-viewport">
      <div class="map-world" id="map-world">
        <svg class="map-links" width="${MAP_W}" height="${MAP_H}" aria-hidden="true">${linkSvg}</svg>
        ${nodeHtml}
      </div>
      <div class="map-zoom">
        <button data-zoom="in" aria-label="放大">＋</button>
        <button data-zoom="out" aria-label="缩小">－</button>
      </div>
      <p class="map-hint">拖拽平移 · 滚轮缩放</p>
      ${nodes.length===0 ? `<div class="map-empty">这一天还没有收集香气</div>` : ''}
    </div>
    <div class="map-foot">
      <div class="map-legend">${legend}</div>
      <p class="map-footnote">每次获得 Prada 处方，香气都会被收藏进这张地图</p>
    </div>
  </section>`;
}

let mapTouched = false;

// ── 地图交互 ──
function applyMapView() {
  const world = document.getElementById('map-world');
  if (world) world.style.transform = `translate(${mapView.tx}px, ${mapView.ty}px) scale(${mapView.scale})`;
}

function zoomAt(factor, cx, cy) {
  const prev = mapView.scale;
  const next = clamp(mapView.scale * factor, 0.35, 5);
  const k = next / prev;
  mapView.tx = cx - (cx - mapView.tx) * k;
  mapView.ty = cy - (cy - mapView.ty) * k;
  mapView.scale = next;
  applyMapView();
}

function bindMapInteractions() {
  const vp = document.getElementById('map-viewport');
  if (!vp) return;
  if (!mapTouched) {
    const r = vp.getBoundingClientRect();
    mapView.tx = (r.width - MAP_W) / 2;
    mapView.ty = (r.height - MAP_H) / 2;
  }
  applyMapView();

  let dragging = false, sx = 0, sy = 0, ox = 0, oy = 0;
  vp.addEventListener('pointerdown', e => {
    dragging = true; mapTouched = true;
    sx = e.clientX; sy = e.clientY; ox = mapView.tx; oy = mapView.ty;
    try { vp.setPointerCapture(e.pointerId); } catch {}
  });
  vp.addEventListener('pointermove', e => {
    if (!dragging) return;
    mapView.tx = ox + (e.clientX - sx);
    mapView.ty = oy + (e.clientY - sy);
    applyMapView();
  });
  const endDrag = () => { dragging = false; };
  vp.addEventListener('pointerup', endDrag);
  vp.addEventListener('pointercancel', endDrag);
  vp.addEventListener('wheel', e => {
    e.preventDefault();
    mapTouched = true;
    const r = vp.getBoundingClientRect();
    zoomAt(e.deltaY < 0 ? 1.12 : 0.88, e.clientX - r.left, e.clientY - r.top);
  }, { passive:false });
  vp.querySelectorAll('[data-zoom]').forEach(btn => {
    btn.addEventListener('click', () => {
      mapTouched = true;
      const r = vp.getBoundingClientRect();
      zoomAt(btn.getAttribute('data-zoom') === 'in' ? 1.3 : 0.75, r.width/2, r.height/2);
    });
  });
}

function b64Encode(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}
function b64Decode(b64) {
  const bin = atob(b64);
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}
function encodeBottle(obj) {
  return b64Encode(JSON.stringify(obj)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function decodeBottle(h) {
  try {
    let s = h.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    return JSON.parse(b64Decode(s));
  } catch { return null; }
}

function copyText(text) {

}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch {}
  document.body.removeChild(ta);
}

function roundRectPath(x, x0, y0, w, h, r) {
  x.beginPath();
  x.moveTo(x0 + r, y0);
  x.arcTo(x0 + w, y0, x0 + w, y0 + h, r);
  x.arcTo(x0 + w, y0 + h, x0, y0 + h, r);
  x.arcTo(x0, y0 + h, x0, y0, r);
  x.arcTo(x0, y0, x0 + w, y0, r);
  x.closePath();
}

function drawBottleOnCanvas(ctx, cx, cy) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => { ctx.drawImage(img, cx - 78, cy - 120, 156, 234); res(); };
    img.onerror = () => res();
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(BOTTLE_SVG);
  });
}

async function drawBottleCard(r) {
  const db = dbById(r.best);
  const fragName = db ? db.name : (r.best || '—');
  const w = 600, h = 840;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d');
  const font = '"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif';

  const g = x.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#123250'); g.addColorStop(1, '#071427');
  x.fillStyle = g; x.fillRect(0, 0, w, h);

  for (let i = 0; i < 130; i++) {
    x.globalAlpha = 0.2 + Math.random() * 0.65;
    x.fillStyle = '#ffffff';
    x.beginPath();
    x.arc(Math.random() * w, Math.random() * h * 0.5, Math.random() * 1.4 + 0.4, 0, Math.PI * 2);
    x.fill();
  }
  x.globalAlpha = 1;

  x.fillStyle = 'rgba(255,255,255,0.85)';
  x.beginPath(); x.arc(505, 86, 26, 0, Math.PI * 2); x.fill();
  x.fillStyle = 'rgba(255,255,255,0.10)';
  x.beginPath(); x.arc(505, 86, 42, 0, Math.PI * 2); x.fill();

  const waveCols = ['rgba(120,185,235,0.16)', 'rgba(140,200,245,0.22)', 'rgba(90,160,220,0.14)'];
  waveCols.forEach((col, wi) => {
    x.fillStyle = col;
    x.beginPath();
    const y0 = h - 70 + wi * 34;
    x.moveTo(0, y0);
    for (let px = 0; px <= w; px += 10) x.lineTo(px, y0 + Math.sin(px / 44 + wi * 2.1) * 20);
    x.lineTo(w, h); x.lineTo(0, h); x.closePath(); x.fill();
  });

  const cw = 440, ch = 320, cx0 = (w - cw) / 2, cy0 = h * 0.60;
  x.shadowColor = 'rgba(0,0,0,0.35)'; x.shadowBlur = 30; x.shadowOffsetY = 10;
  roundRectPath(x, cx0, cy0, cw, ch, 22);
  x.fillStyle = '#FFF9EC'; x.fill();
  x.shadowColor = 'transparent'; x.shadowBlur = 0; x.shadowOffsetY = 0;

  x.fillStyle = '#2A2318';
  x.font = '600 13px ' + font;
  x.fillText('P R A D A  ·  香 气 人 格 报 告', cx0 + 28, cy0 + 40);
  x.font = 'italic 44px Georgia, "Songti SC", serif';
  x.fillText(r.ep, cx0 + 28, cy0 + 106);
  x.font = '13px ' + font;
  x.fillStyle = 'rgba(42,35,24,0.55)';
  x.fillText(r.tagline || '', cx0 + 28, cy0 + 140, cw - 56);

  x.strokeStyle = 'rgba(42,35,24,0.14)';
  x.beginPath(); x.moveTo(cx0 + 28, cy0 + 158); x.lineTo(cx0 + cw - 28, cy0 + 158); x.stroke();

  x.fillStyle = '#7A4A2B';
  x.font = '600 15px Georgia, "Songti SC", serif';
  x.fillText('本命香  ' + fragName, cx0 + 28, cy0 + 190);
  x.font = '12px ' + font;
  x.fillStyle = 'rgba(42,35,24,0.7)';
  x.fillText('人格契合  ' + r.fit + '%   ·   基于 ' + r.count + ' 次香气记录', cx0 + 28, cy0 + 220);

  x.font = '9px ' + font;
  x.fillStyle = 'rgba(42,35,24,0.35)';
  x.fillText('来自 Prada 香气地图 · 漂流瓶', cx0 + 28, cy0 + ch - 22);

  await drawBottleOnCanvas(x, w / 2, 400);

  return c.toDataURL('image/png');
}

window.downloadBottleCard = async function() {
  const d = currentBottleData();
  if (!d) return;
  const r = bottleToReport(d);
  const url = await drawBottleCard(r);
  const a = document.createElement('a');
  a.href = url;
  a.download = `prada-香气人格-${r.ep}.png`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  const status = document.querySelector('#bottle-share .bottle-status');
  if (status) { status.textContent = '🖼️ 香气人格卡片已保存'; status.classList.add('show'); }
};

window.openBottleFloat = function() {
  const ov = document.getElementById('bottle-share');
  if (!ov || !ov.classList.contains('recv')) {
    const f = document.getElementById('bottle-float');
    if (f) { f.style.animation = 'none'; void f.offsetWidth; f.style.animation = ''; }
    return;
  }
  const letter = ov.querySelector('.bottle-letter');
  if (letter) letter.classList.add('open');
};

function checkIncomingBottle() {
  const m = location.hash.match(/#bottle=([A-Za-z0-9_-]+)/);
  if (!m) return;
  const d = decodeBottle(m[1]);
  if (!d) return;
  const ov = document.getElementById('bottle-share');
  if (!ov) return;
  const r = bottleToReport(d);
  ov.classList.add('open', 'recv');
  ov.querySelector('.bottle-report').innerHTML = reportPreviewHTML(r);
  ov.querySelector('.bottle-actions').innerHTML = `
    <button class="bottle-action primary" onclick="openBottleFloat()">拆开瓶中信</button>
    <button class="bottle-action" onclick="closeBottle()">晚点再看</button>`;
  const letter = ov.querySelector('.bottle-letter');
  if (letter) { letter.innerHTML = letterHTML(r); letter.classList.remove('open'); }
  document.body.style.overflow = 'hidden';
  injectStars();
}

// ─────────────────────────────────────────────────────────────
// 初始化：优先读真实 localStorage，fallback 到 Mock 数据
// ─────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  const real = loadPrescriptions();
  allPrescriptions = real && real.length ? real : MOCK_PRESCRIPTIONS;
  render();
  initBottleUI();
  checkIncomingBottle();
});
</script>
